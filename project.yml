name: fuda
options:
  bundleIdPrefix: com.hidekingerz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 2
    DEVELOPMENT_TEAM: 2YSEF93UZH
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  fuda:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: fuda
        CFBundleDisplayName: fuda
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 hidekingerz"
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.hidekingerz.fuda
            CFBundleURLSchemes: [fuda]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidekingerz.fuda
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  fudaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: fuda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hidekingerz.fuda.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  fuda:
    build:
      targets:
        fuda: all
        fudaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - fudaTests
